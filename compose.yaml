services:
  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/orders"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - private

  order-service:
    build: ./order-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${ORDER_DATABASE_URL:?Set ORDER_DATABASE_URL in .env}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:?Set INVENTORY_SERVICE_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
    depends_on:
      order-db:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - private
      - order-data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  inventory-service:
    build: ./inventory-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${INVENTORY_DATABASE_URL:?Set INVENTORY_DATABASE_URL in .env}
    depends_on:
      inventory-db:
        condition: service_healthy
    networks:
      - private
      - inventory-data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?Set NOTIFICATION_DATABASE_URL in .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL in .env}
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - private
      - notification-data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  order-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - order-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  inventory-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - inventory-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - notification-data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U \"$${POSTGRES_USER}\" -d notification_db"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - private
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  order-db-data:
  inventory-db-data:
  notification-db-data:
  rabbitmq-data:

networks:
  private:
    internal: true
  order-data:
    internal: true
  inventory-data:
    internal: true
  notification-data:
    internal: true
