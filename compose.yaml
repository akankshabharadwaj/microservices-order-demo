services:
  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      order-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/api/orders/health
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - private

  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: ${ORDER_DATABASE_URL:?Set ORDER_DATABASE_URL in .env}
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
    depends_on:
      order-db:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - private

  notification-service:
    build: ./notification-service
    environment:
      DATABASE_URL: ${NOTIFICATION_DATABASE_URL:?Set NOTIFICATION_DATABASE_URL in .env}
    depends_on:
      notification-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - private

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d order_db'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d notification_db'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

volumes:
  order-db-data:
  notification-db-data:

networks:
  private:
    driver: bridge
